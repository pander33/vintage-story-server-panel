name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VintageStoryPanel.slnx

      - name: Format
        if: runner.os == 'Windows'
        run: dotnet format whitespace VintageStoryPanel.slnx --verify-no-changes

      - name: Build
        run: dotnet build VintageStoryPanel.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test VintageStoryPanel.slnx --no-build --configuration Release

  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/publish.sh ${{ matrix.rid }}

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\publish.ps1 ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: vs-panel-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
