name: CI

# Тексты и скриншоты сборку не меняют: минуты Actions на них не тратятся.
on:
  push:
    branches: [master]
    # Тег v<версия> публикует релиз: из него ставят deploy/get.sh, get.ps1 и vs-panel update.
    # paths-ignore на теги не действует.
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'screenshots/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'screenshots/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    # Автоматически — только Linux: минута Windows в приватном репозитории стоит две.
    # Windows добавляется при ручном запуске и выпуске релиза.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          # PanelVersion есть только в одной PropertyGroup; [string] над всем списком склеил бы
          # пустые значения остальных через пробел.
          $version = @($props.Project.PropertyGroup.PanelVersion | Where-Object { $_ })[0].Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match PanelVersion $version"
          }

      - name: Check bootstrap syntax (Linux)
        if: runner.os == 'Linux'
        run: sh -n deploy/get.sh && bash -n scripts/publish.sh

      - name: Check bootstrap syntax (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'deploy/windows/get.ps1'), [ref] $tokens, [ref] $errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

      - name: Restore
        run: dotnet restore VintageStoryPanel.slnx

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Frontend tests
        run: node --test tests/frontend/api-token-session.test.js

      - name: Release script tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/scripts/release.test.ps1

      - name: Format
        if: runner.os == 'Linux'
        run: dotnet format whitespace VintageStoryPanel.slnx --verify-no-changes

      - name: Build
        run: dotnet build VintageStoryPanel.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test VintageStoryPanel.slnx --no-build --configuration Release

  # Пакет self-contained весит сотни мегабайт, а квота хранилища Actions общая на аккаунт.
  # Поэтому пакеты собираются только по ручному запуску (Actions → CI → Run workflow)
  # и хранятся один день: этого хватает, чтобы скачать сборку. Тег v* собирает их для релиза.
  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/publish.sh ${{ matrix.rid }}

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\publish.ps1 ${{ matrix.rid }}

      - name: Check CLI version (Linux x64)
        if: matrix.rid == 'linux-x64'
        run: artifacts/linux-x64/Panel.Cli version

      - name: Check CLI version (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\artifacts\win-x64\Panel.Cli.exe version

      # Архив релиза: внутри каталог vs-panel-<цель>. tar собирается здесь, а не в задании
      # release: артефакт Actions теряет права файлов, и install.sh перестал бы быть исполняемым.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/release
          tar -C artifacts --owner=0 --group=0 --numeric-owner \
            --transform 's,^${{ matrix.rid }},vs-panel-${{ matrix.rid }},' \
            -czf artifacts/release/vs-panel-${{ matrix.rid }}.tar.gz ${{ matrix.rid }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Move-Item artifacts/${{ matrix.rid }} artifacts/vs-panel-${{ matrix.rid }}
          [IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path artifacts/vs-panel-${{ matrix.rid }}).Path,
            (Join-Path (Resolve-Path artifacts/release).Path 'vs-panel-${{ matrix.rid }}.zip'),
            [IO.Compression.CompressionLevel]::Optimal, $true)

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify release package
        run: python scripts/verify-release.py artifacts/release

      # И ручная сборка, и релиз хранят готовые архивы: права Linux не теряются.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('release-{0}', matrix.rid) || format('vs-panel-{0}', matrix.rid) }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify all release packages
        run: python scripts/verify-release.py dist --all

      - name: Bootstrap scripts and checksums
        run: |
          cp deploy/get.sh dist/get.sh
          cp deploy/windows/get.ps1 dist/get.ps1
          cd dist
          sha256sum vs-panel-* get.sh get.ps1 > SHA256SUMS
          sha256sum --check SHA256SUMS

      # Пока все вложения не загружены, черновик не попадает в releases/latest.
      # Тег с дефисом — пререлиз, доступный только по явной версии.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=
          case "$version" in *-*) prerelease=--prerelease ;; esac
          notes="docs/releases/$version.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "$notes" --verify-tag --draft $prerelease
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag --draft $prerelease
          fi
          if [ -z "$prerelease" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
