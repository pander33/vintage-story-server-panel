name: CI

# Тексты и скриншоты сборку не меняют: минуты Actions на них не тратятся.
on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'screenshots/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'screenshots/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    # Автоматически — только Linux: минута Windows в приватном репозитории стоит две.
    # Windows добавляется при ручном запуске.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VintageStoryPanel.slnx

      - name: Format
        if: runner.os == 'Linux'
        run: dotnet format whitespace VintageStoryPanel.slnx --verify-no-changes

      - name: Build
        run: dotnet build VintageStoryPanel.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test VintageStoryPanel.slnx --no-build --configuration Release

  # Пакет self-contained весит сотни мегабайт, а квота хранилища Actions общая на аккаунт.
  # Поэтому пакеты собираются только по ручному запуску (Actions → CI → Run workflow)
  # и хранятся один день: этого хватает, чтобы скачать сборку.
  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/publish.sh ${{ matrix.rid }}

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\publish.ps1 ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: vs-panel-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
