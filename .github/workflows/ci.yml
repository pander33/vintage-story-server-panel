name: CI

# Тексты и скриншоты сборку не меняют: минуты Actions на них не тратятся.
on:
  push:
    branches: [master]
    # Тег v<версия> публикует релиз: из него ставят deploy/get.sh, get.ps1 и vs-panel update.
    # paths-ignore на теги не действует.
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'screenshots/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'screenshots/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    # Автоматически — только Linux: минута Windows в приватном репозитории стоит две.
    # Windows добавляется при ручном запуске.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VintageStoryPanel.slnx

      - name: Format
        if: runner.os == 'Linux'
        run: dotnet format whitespace VintageStoryPanel.slnx --verify-no-changes

      - name: Build
        run: dotnet build VintageStoryPanel.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test VintageStoryPanel.slnx --no-build --configuration Release

  # Пакет self-contained весит сотни мегабайт, а квота хранилища Actions общая на аккаунт.
  # Поэтому пакеты собираются только по ручному запуску (Actions → CI → Run workflow)
  # и хранятся один день: этого хватает, чтобы скачать сборку. Тег v* собирает их для релиза.
  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/publish.sh ${{ matrix.rid }}

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\publish.ps1 ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: vs-panel-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

      # Архив релиза: внутри каталог vs-panel-<цель>. tar собирается здесь, а не в задании
      # release: артефакт Actions теряет права файлов, и install.sh перестал бы быть исполняемым.
      - name: Package (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        run: |
          mkdir -p artifacts/release
          tar -C artifacts --owner=0 --group=0 --numeric-owner \
            --transform 's,^${{ matrix.rid }},vs-panel-${{ matrix.rid }},' \
            -czf artifacts/release/vs-panel-${{ matrix.rid }}.tar.gz ${{ matrix.rid }}

      - name: Package (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Move-Item artifacts/${{ matrix.rid }} artifacts/vs-panel-${{ matrix.rid }}
          [IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path artifacts/vs-panel-${{ matrix.rid }}).Path,
            (Join-Path (Resolve-Path artifacts/release).Path 'vs-panel-${{ matrix.rid }}.zip'),
            [IO.Compression.CompressionLevel]::Optimal, $true)

      # Архивы уже сжаты: повторное сжатие артефакта только тратит время.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # vs-panel update сравнивает тег с активной версией: тег обязан совпадать с VERSION пакета.
      - name: Check version
        run: |
          version="$(sed -n 's:.*<PanelVersion>\(.*\)</PanelVersion>.*:\1:p' Directory.Build.props | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match PanelVersion $version in Directory.Build.props" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum vs-panel-* > SHA256SUMS
          cat SHA256SUMS

      # Тег с дефисом (v0.3.0-rc1) — пререлиз: releases/latest его не отдаёт, и get.sh, get.ps1
      # и vs-panel update берут его только по явной версии.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
